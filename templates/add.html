<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Habits</title>
    <style>
        /* Modern, minimal layout reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #f8fafc;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Background glow effect */
        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 50%;
            filter: blur(100px);
            top: 10%;
            left: 20%;
            z-index: 0;
        }

        /* The Card Container - Glassmorphism style matching dashboard */
        .add-card {
            width: 100%;
            max-width: 500px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            z-index: 1;
        }

        /* Heading elements styled matching dashboard header */
        h1 {
            font-size: clamp(2rem, 4vw, 2.5rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(to right, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
            text-align: center;
            margin-bottom: 32px;
            letter-spacing: 0.01em;
        }

        /* --- Form Elements --- */
        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        /* Glassmorphism Text Inputs */
        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            font-size: 1rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #f8fafc;
            transition: all 0.2s ease-in-out;
        }

        input[type="text"]::placeholder {
            color: #64748b;
        }

        input[type="text"]:focus {
            border-color: rgba(129, 140, 248, 0.6);
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.2);
            outline: none;
            background-color: rgba(15, 23, 42, 0.8);
        }

        .hint {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 8px;
            letter-spacing: 0.01em;
        }

        /* --- Action Button (Matching Dashboard themes) --- */
        .btn-add {
            width: 100%;
            background: linear-gradient(to right, #34d399, #059669); /* Green accent gradient to indicate addition */
            color: #ffffff;
            border: none;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 12px rgba(52, 211, 153, 0.2);
            margin-top: 8px;
            letter-spacing: 0.02em;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(52, 211, 153, 0.4);
            filter: brightness(1.1);
        }

        .btn-add:active {
            transform: translateY(0);
        }

        /* --- Navigation Link --- */
        .nav-link-container {
            display: flex;
            justify-content: center;
            margin-top: 24px;
        }

        .nav-link {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-link:hover {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="add-card">
        <h1>➕ Add Habits</h1>
        <p class="subtitle">Type your habits separated by commas.</p>

        <form method="POST" action="">
            <div class="form-group">
                <label for="habits-input">Habits</label>
                <input type="text" id="habits-input" name="habits" 
                       placeholder="e.g. read, workout, meditate" required>
                <p class="hint">Separate each habit with a comma.</p>
            </div>

            <button type="submit" class="btn-add">Add Habits</button>
        </form>

        <div class="nav-link-container">
            <a href="/" class="nav-link">← Back to Dashboard</a>
        </div>
    </div>

</body>
</html>
