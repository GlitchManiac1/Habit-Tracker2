<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
    <style>
        /* Modern, minimal layout reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #f8fafc;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Background glow effect */
        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 50%;
            filter: blur(100px);
            top: 10%;
            left: 20%;
            z-index: 0;
        }

        /* The Card Container - Glassmorphism style matching dashboard */
        .message-card {
            width: 100%;
            max-width: 480px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 40px 48px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            z-index: 1;
        }

        /* Border accents mapping success vs error status state */
        .message-card.success {
            border: 1px solid rgba(52, 211, 153, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 0 20px rgba(52, 211, 153, 0.05);
        }

        .message-card.error {
            border: 1px solid rgba(248, 113, 113, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 0 20px rgba(248, 113, 113, 0.05);
        }

        /* Heading elements styled matching dashboard header templates */
        .message-card h1 {
            font-size: clamp(2rem, 4vw, 2.5rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 12px;
        }

        /* Conditional colors for headings */
        .success h1 {
            background: linear-gradient(to right, #34d399, #059669);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .error h1 {
            background: linear-gradient(to right, #f87171, #dc2626);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .message-card p {
            font-size: 1rem;
            color: #94a3b8;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        /* --- Action Button (Matching Dashboard log link button style) --- */
        .btn-ok {
            display: inline-block;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            color: #ffffff;
            padding: 14px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.02em;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
            width: 100%;
        }

        .btn-ok:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
            filter: brightness(1.1);
        }

        .btn-ok:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="message-card {{ 'success' if success else 'error' }}">
        <h1>{{ '✅ Success!' if success else '❌ Oops!' }}</h1>
        <p>{{ message }}</p>
        <a href="{{ redirect_url }}" class="btn-ok">OK</a>
    </div>

</body>
</html>
